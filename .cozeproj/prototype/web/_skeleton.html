<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高校智慧碳管理平台</title>

  <!-- @theme: Design Tokens 禁止修改 -->
  <style>
    :root {
      /* 主色系 - 科技蓝 */
      --primary: 210 100% 50%;
      --primary-foreground: 0 0% 100%;

      /* 功能色 */
      --success: 142 76% 36%;
      --warning: 38 92% 50%;
      --danger: 0 84% 60%;
      --info: 200 100% 45%;

      /* 暖红色点缀 - 用于数字孪生场景 */
      --brick-red: 10 60% 50%;
      --brick-light: 10 50% 65%;
      --warm-yellow: 40 60% 55%;
      --warm-yellow-light: 40 40% 80%;

      /* 背景与表面 */
      --background: 0 0% 98%;
      --foreground: 222 47% 11%;
      --card: 0 0% 100%;
      --card-foreground: 222 47% 11%;
      --muted: 210 40% 96%;
      --muted-foreground: 215 16% 47%;
      --border: 214 32% 91%;

      /* 字体 */
      --font-sans: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Inter, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Roboto Mono", ui-monospace, monospace;

      /* 字体大小 */
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.25rem;
      --text-5xl: 3rem;

      /* 间距 */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-2xl: 3rem;

      /* 圆角 */
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;

      /* 阴影 */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--background);
      color: hsl(var(--foreground));
      font-size: var(--text-base);
      line-height: 1.6;
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* ===== 侧边栏导航 ===== */
    /* @nav:start */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: hsl(222 47% 11%);
      color: hsl(0 0% 100%);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: var(--spacing-lg);
      border-bottom: 1px solid hsl(222 47% 20%);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .sidebar-brand-icon {
      width: 32px;
      height: 32px;
      background: hsl(var(--primary));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
    }

    .sidebar-brand-text {
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1.3;
    }

    .sidebar-brand-sub {
      font-size: var(--text-xs);
      color: hsl(215 16% 60%);
      font-weight: 400;
    }

    .sidebar-nav {
      padding: var(--spacing-md) 0;
      flex: 1;
    }

    .sidebar-nav-group {
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-xs);
    }

    .sidebar-nav-group-title {
      font-size: var(--text-xs);
      color: hsl(215 16% 50%);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: var(--spacing-sm) var(--spacing-sm);
      font-weight: 600;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 9px 12px;
      border-radius: var(--radius-md);
      color: hsl(215 16% 70%);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: all 150ms ease-out;
      cursor: pointer;
      position: relative;
    }

    .sidebar-nav-item:hover {
      background: hsl(222 47% 16%);
      color: hsl(0 0% 95%);
    }

    .sidebar-nav-item[aria-current="page"],
    .sidebar-nav-item.active {
      background: hsl(var(--primary) / 0.15);
      color: hsl(var(--primary));
    }

    .sidebar-nav-item[aria-current="page"]::before,
    .sidebar-nav-item.active::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: hsl(var(--primary));
      border-radius: 0 2px 2px 0;
    }

    .sidebar-nav-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-nav-icon svg {
      width: 18px;
      height: 18px;
    }

    .sidebar-footer {
      padding: var(--spacing-md);
      border-top: 1px solid hsl(222 47% 20%);
      font-size: var(--text-xs);
      color: hsl(215 16% 50%);
    }

    /* ===== 主内容区 ===== */
    .main-content {
      flex: 1;
      margin-left: 240px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部栏 ===== */
    .topbar {
      height: 64px;
      min-height: 64px;
      background: hsl(var(--card));
      border-bottom: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--spacing-xl);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .topbar-page-title {
      font-size: var(--text-lg);
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .topbar-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: var(--text-xs);
      font-weight: 500;
      background: hsl(var(--warning) / 0.1);
      color: hsl(var(--warning));
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--text-sm);
      color: hsl(var(--muted-foreground));
    }

    .topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: hsl(var(--primary) / 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: hsl(var(--primary));
      font-size: var(--text-sm);
      font-weight: 600;
    }

    /* ===== 页面内容区 ===== */
    .page-content {
      flex: 1;
      padding: var(--spacing-xl);
    }

    /* ===== 水印 ===== */
    .watermark {
      position: fixed;
      bottom: 8px;
      right: 16px;
      font-size: var(--text-xs);
      color: hsl(215 16% 65% / 0.8);
      z-index: 999;
      pointer-events: none;
      user-select: none;
    }
    /* @nav:end */
  </style>

  <!-- 字体/图标 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

      <nav class="sidebar-nav">

    <!-- ===== 主内容区 ===== -->
    <div class="main-content">

      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-page-title" id="pageTitle">页面标题</div>
        </div>
        <div class="topbar-right">
          <span class="topbar-badge">
            <i data-lucide="circle" style="width:8px;height:8px;fill:currentColor;"></i>

      <!-- 页面内容 -->

      <main class="page-content" id="pageContent">

  </div>

  <!-- 水印 -->
  <div class="watermark">Demo 模拟数据，不用于申报</div>

  <script>
    lucide.createIcons();
  </script>
</body>
