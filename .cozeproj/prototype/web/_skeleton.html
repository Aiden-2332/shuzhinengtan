<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体：Noto Sans SC 中文 -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>
  <!-- ECharts CDN -->
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/echarts/echarts-5.5.1.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #3488ff;
      --color-primary-container:    #1a5cc8;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（深蓝科技风） === */
      --color-background:                 #081028;
      --color-surface-container-lowest:   #0a1535;
      --color-surface:                    #0d1a3a;
      --color-surface-container:          #122040;
      --color-surface-container-high:     #162848;
      --color-surface-container-highest:  #1a3050;
      /* === 文字 === */
      --color-on-surface:           #e8edf5;
      --color-on-surface-variant:   #8a9bbd;
      /* === 功能色 === */
      --color-success:  #36d968;
      --color-error:    #ff3333;
      --color-warning:  #ff7b25;
      --color-info:     #3488ff;
      /* === 边框（低透明度蓝调） === */
      --color-outline:          rgba(52, 136, 255, 0.2);
      --color-outline-variant:  rgba(52, 136, 255, 0.1);
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow-float:  0 10px 25px rgba(0, 0, 0, 0.5);
      --shadow-dialog: 0 25px 50px rgba(0, 0, 0, 0.6);
      /* === 字体 === */
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Roboto Mono", ui-monospace, monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%230d1a3a"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%238a9bbd" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!--
    全屏沉浸式数据大屏，无传统导航。
    布局：左侧面板 + 中间3D校园场景 + 右侧面板 + 底部80px操作栏
    指标卡片分布在左右两侧和底部，中间为已建构的校园3D模型
  -->

  <!-- @main-content:start -->
  <main class="w-full h-screen overflow-hidden flex flex-col">
    <!-- 顶部标题栏 -->
    <header class="h-12 shrink-0 flex items-center justify-between px-6 bg-surface-container-lowest/80 border-b border-outline-variant/20">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center">
          <i data-lucide="wrench" class="w-3.5 h-3.5 text-white"></i>
        </div>
        <div>
          <h1 class="text-on-surface font-semibold text-sm">后勤运营明细</h1>
          <p class="text-on-surface-variant text-[10px]">碳排放全景驾驶舱</p>
        </div>
        <div class="h-5 w-px bg-outline-variant/30 mx-2"></div>
        <div class="flex items-center gap-2 text-xs">
          <span class="text-on-surface-variant">年度</span>
          <span class="text-primary font-medium">2026</span>
          <span class="text-on-surface-variant/40">|</span>
          <span class="text-on-surface-variant">校区</span>
          <span class="text-primary font-medium">主校区</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-success/10 border border-success/20">
          <div class="w-1.5 h-1.5 rounded-full bg-success animate-pulse"></div>
          <span class="text-success text-xs">数据实时</span>
        </div>
      </div>
    </header>

    <!-- 上方主区域：左面板 + 3D场景 + 右面板 -->
    <div class="flex-1 flex min-h-0">
      <!-- 左侧指标面板 ~20% -->
      <aside class="w-[20%] min-w-[220px] shrink-0 bg-surface-container-lowest/60 border-r border-outline-variant/20 overflow-y-auto overflow-x-hidden">
        <div class="p-2.5 space-y-2.5">
          <!-- 卡片1: 能源四分项总览 -->
          <!-- 卡片2: 碳排放总览 -->
          <!-- 卡片3: 四类告警 + 工单状态 -->
        </div>
      </aside>

      <!-- 中间3D校园场景 -->
      <div class="flex-1 relative bg-background">
        <!-- 3D Canvas 区域（已有CampusScene3D组件） -->
        <!-- 实时负荷悬浮面板（左下角覆盖） -->
        <!-- 色阶图例（右下角固定） -->
      </div>

      <!-- 右侧指标面板 ~24% -->
      <aside class="w-[24%] min-w-[260px] shrink-0 bg-surface-container-lowest/60 border-l border-outline-variant/20 overflow-y-auto overflow-x-hidden">
        <div class="p-2.5 space-y-2.5">
          <!-- 卡片4: 系统运行效率 -->
          <!-- 卡片5: 仪表在线率 -->
          <!-- 卡片6: 异常楼宇 + 设备警告 -->
        </div>
      </aside>
    </div>

    <!-- 底部操作栏 80px -->
    <footer class="h-20 shrink-0 bg-surface-container-lowest/90 border-t border-outline-variant/20 flex items-center justify-between px-4">
      <!-- 底部按钮组 -->
    </footer>
  </main>
  <!-- @main-content:end -->

  <!-- 全页面水印 -->
  <div class="fixed bottom-2 right-4 text-xs text-on-surface-variant/50 pointer-events-none select-none z-50">
    Demo模拟数据 仅课题演示
  </div>

  <script>lucide.createIcons();</script>
</body>

</html>
